<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Formulaire</title>

	<link rel="stylesheet" type="text/css" href="Formulaireclient.css">
</head>
<body>
	<div containerF>
		<h1 class="form-title">Confirm Your Order</h1>
		<form action="#">

			<div class="main-user-info">
				<div class="user-input-box">
					<label for="firstname">First Name</label>
					<input type="text"
					id="firstName"
					name="firstname"
					placeholder="Enter First Name"/>
				</div>
				<div class="user-input-box">
					<label for="lastname">Last Name</label>
					<input type="text"
					id="lastname"
					name="lastname"
					placeholder="Enter lastname"/>
				</div>
				<div class="user-input-box">
					<label for="email">Email</label>
					<input type="email"
					id="email"
					name="email"
					placeholder="Enter Email"/>
				</div>
				<div class="user-input-box">
					<label for="phoneNumber">Adress</label>
					<input type="text"
					id="adress"
					name="adress"
					placeholder="Enter Your Adress"/>
				</div>
			</div>

			
			<div class="btn">
				<a id="submit2" href="menu.html" class="link">Confirm</a>
				<!--<input type="submit" value="Confirm" href="menu.html">-->
		    </div>
			
		</form>
	</div>

	 <!--Js link-->
	 <script src="app.js" type="text/javascript"></script>

	
</body>
</html>
